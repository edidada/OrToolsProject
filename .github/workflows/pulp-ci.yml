name: PuLP Optimization CI

on:
  push:
    branches: [ main]
  pull_request:
    branches: [ main]
  schedule:
    - cron: '0 2 * * 1'  # 每周一凌晨2点运行

jobs:
  test-pulp:
    name: Test PuLP Optimization
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.9', '3.10', '3.11']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pulp
        pip install pytest

    - name: Run PuLP example
      run: |
        python pulp_example.py

    - name: Test with pytest
      run: |
        python -m pytest test_pulp.py -v

  benchmark:
    name: Performance Benchmark
    runs-on: ubuntu-latest
    needs: test-pulp

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install pulp
        pip install memory-profiler
        pip install psutil

    - name: Run benchmark
      run: |
        python benchmark_pulp.py