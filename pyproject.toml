[project]
name = "ortools-project"
version = "0.1.0"
description = "Optimization project using PuLP and OR-Tools"
authors = [{ name = "Your Name", email = "your.email@example.com" }]
readme = "README.md"
requires-python = ">=3.9,<4.0"
dependencies = [
    "pulp>=2.8,<3.0",
    "psutil>=5.9,<6.0",
    "pytest>=7.4,<8.0",
    "ortools>=9.15.6755,<10.0.0",
]

[project.scripts]
pulp-example = "ortools_project.pulp_example:main"
cp-sat-schedule = "ortools_project.examples.cp_sat_schedule:main"
oral-exam-seating = "ortools_project.examples.oral_exam_seating:main"

[tool.poetry]
packages = [
    { include = "ortools_project", from = "src" }
]

[tool.poetry.group.dev.dependencies]
black = "^23.0"
flake8 = "^6.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
